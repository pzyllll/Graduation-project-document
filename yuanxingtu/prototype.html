<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgeU - Functional Prototype v2.10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #000000; }
        .bento-card { border: 2px solid #000000; transition: all 0.2s ease; background: white; }
        .bento-card:hover { box-shadow: 4px 4px 0px #000000; transform: translate(-2px, -2px); }
        .btn-primary { background-color: #000000; color: #ffffff; border: 2px solid #000000; }
        .btn-primary:hover { background-color: #ffffff; color: #000000; }
        .btn-outline { border: 2px solid #000000; color: #000000; }
        .status-badge { border: 1px solid #000000; padding: 2px 8px; font-size: 0.65rem; text-transform: uppercase; font-weight: bold; }
        .ai-glow { animation: border-dance 2s infinite linear; border: 2px dashed #000; }
        @keyframes border-dance { 0% { border-style: dashed; } 50% { border-style: dotted; } 100% { border-style: dashed; } }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="app">
        <!-- Navigation (URS-03) -->
        <nav id="main-nav" class="hidden border-b-2 border-black sticky top-0 bg-white z-50">
            <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="font-bold text-2xl tracking-tighter cursor-pointer" onclick="showPage('briefing')">BridgeU</div>
                <div class="flex space-x-4 items-center">
                    <button onclick="showPage('briefing')" class="text-sm font-bold hover:underline">Briefing</button>
                    <button onclick="showPage('community')" class="text-sm font-bold hover:underline">Community</button>
                    <button onclick="showPage('relationships')" class="text-sm font-bold hover:underline">Connect</button>
                    <div class="flex items-center space-x-2 ml-4">
                        <button onclick="showPage('profile')" class="w-8 h-8 rounded-full border-2 border-black flex items-center justify-center font-bold">U</button>
                        <select onchange="toggleLanguage(this.value)" class="border-2 border-black text-xs px-1 py-1">
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                        </select>
                        <button onclick="handleLogout()" class="text-xs font-bold underline">Log Out</button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto p-4">
            
            <!-- SECTION: Auth Flow -->
            <section id="page-auth" class="max-w-md mx-auto mt-16">
                <div class="bento-card p-8">
                    <div id="auth-toggle" class="flex mb-6 border-b-2 border-black">
                        <button onclick="toggleAuthMode('login')" id="btn-login-mode" class="flex-1 py-2 font-bold bg-black text-white">Log In</button>
                        <button onclick="toggleAuthMode('register')" id="btn-reg-mode" class="flex-1 py-2 font-bold">Register</button>
                    </div>

                    <!-- Login Form -->
                    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="text" placeholder="Email or Phone Number" class="w-full border-2 border-black p-3 outline-none" required>
                        <input type="password" placeholder="Password" class="w-full border-2 border-black p-3 outline-none" required>
                        <button type="submit" class="w-full btn-primary py-3 font-bold uppercase tracking-tight">Access BridgeU</button>
                    </form>

                    <!-- Register Form -->
                    <form id="form-register" onsubmit="handleRegister(event)" class="hidden space-y-4">
                        <div class="flex border-2 border-black mb-2">
                            <button type="button" onclick="setRegType('email')" id="reg-type-email" class="flex-1 py-1 text-xs font-bold bg-black text-white">Email</button>
                            <button type="button" onclick="setRegType('phone')" id="reg-type-phone" class="flex-1 py-1 text-xs font-bold">Phone</button>
                        </div>
                        <input type="text" id="reg-input-main" placeholder="Email Address" class="w-full border-2 border-black p-2 outline-none" required>
                        <div class="flex space-x-2">
                            <input type="text" placeholder="Verification Code" class="flex-1 border-2 border-black p-2 outline-none text-xs">
                            <button type="button" class="btn-outline px-3 text-[10px] font-bold">Get Code</button>
                        </div>
                        <input type="password" placeholder="Password" class="w-full border-2 border-black p-2 outline-none" required>
                        <input type="text" pattern="[A-Za-z\s]+" placeholder="Display Name (English Only)" class="w-full border-2 border-black p-2 outline-none" required>
                        <select class="w-full border-2 border-black p-2 outline-none text-xs">
                            <option>Interface: English</option>
                            <option>Interface: Chinese</option>
                        </select>
                        <button type="submit" class="w-full btn-primary py-3 font-bold uppercase tracking-tight">Create Account</button>
                    </form>
                </div>
            </section>

            <!-- SECTION: Daily Briefing List -->
            <section id="page-briefing" class="hidden">
                <div class="mb-8">
                    <h2 class="text-4xl font-bold italic tracking-tighter mb-4 uppercase">Daily Briefing</h2>
                    <div class="bento-card p-4 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        <div class="md:col-span-3">
                            <label class="text-[10px] font-bold uppercase">Search Keywords</label>
                            <input type="text" id="briefing-search" placeholder="Search briefing titles..." class="w-full border-2 border-black p-2 outline-none text-sm">
                        </div>
                        
                        <button onclick="renderBriefings()" class="btn-primary py-2 font-bold uppercase text-xs">Apply Filters</button>
                        
                        <!-- URS-05: Date Filters (Changed to Text Input to force DD-MM-YYYY format) -->
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-bold uppercase">Start Date</label>
                            <input type="text" id="briefing-start-date" placeholder="DD-MM-YYYY" class="w-full border-2 border-black p-2 outline-none text-xs">
                        </div>
                        <div class="md:col-span-2">
                            <label class="text-[10px] font-bold uppercase">End Date</label>
                            <input type="text" id="briefing-end-date" placeholder="DD-MM-YYYY" class="w-full border-2 border-black p-2 outline-none text-xs">
                        </div>
                    </div>
                </div>
                <div id="briefing-container" class="space-y-4"></div>
            </section>

            <!-- SECTION: Briefing Detail -->
            <section id="page-briefing-detail" class="hidden max-w-4xl mx-auto">
                <button onclick="showPage('briefing')" class="mb-6 font-bold flex items-center hover:underline text-sm">
                    ← Back to Briefings
                </button>
                <div id="briefing-detail-content" class="space-y-6"></div>
            </section>

            <!-- SECTION: Community Feed -->
            <section id="page-community" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="space-y-4">
                        <button onclick="openModal('modal-create-post')" class="w-full btn-primary py-4 font-bold uppercase tracking-widest">+ New Post</button>
                        <div class="bento-card p-4">
                            <h3 class="text-xs font-bold mb-3 uppercase opacity-50">Filter by Tag</h3>
                            <!-- URS-10: Tag Filters with Logic -->
                            <div class="space-y-2 text-sm" id="tag-filters">
                                <label class="flex items-center"><input type="checkbox" value="All" checked onchange="handleTagFilter(this)" class="mr-2"> All</label>
                                <label class="flex items-center"><input type="checkbox" value="Study" onchange="handleTagFilter(this)" class="mr-2"> Study</label>
                                <label class="flex items-center"><input type="checkbox" value="Housing" onchange="handleTagFilter(this)" class="mr-2"> Housing</label>
                                <label class="flex items-center"><input type="checkbox" value="Travel" onchange="handleTagFilter(this)" class="mr-2"> Travel</label>
                                <label class="flex items-center"><input type="checkbox" value="Part-time Job" onchange="handleTagFilter(this)" class="mr-2"> Part-time Job</label>
                                <label class="flex items-center"><input type="checkbox" value="Life Services" onchange="handleTagFilter(this)" class="mr-2"> Life Services</label>
                            </div>
                        </div>
                    </div>
                    <div class="md:col-span-3">
                        <!-- URS-14: Search Posts -->
                        <div class="flex space-x-2 mb-6">
                            <input type="text" id="community-search" placeholder="Search posts (title or content)..." class="flex-grow border-2 border-black p-3 outline-none text-sm">
                            <button onclick="renderFeed()" class="btn-primary px-8 font-bold uppercase text-xs tracking-widest">Search</button>
                        </div>
                        <div id="community-feed-list" class="space-y-6"></div>
                    </div>
                </div>
            </section>

            <!-- SECTION: Post Detail & AI Summary -->
            <section id="page-post-detail" class="hidden max-w-3xl mx-auto">
                <button onclick="showPage('community')" class="mb-6 font-bold flex items-center hover:underline text-sm">
                    ← Back to Community
                </button>
                <div id="post-detail-content"></div>
                <div class="mt-8 pt-8 border-t-4 border-black">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-xl uppercase tracking-tighter">Comments</h3>
                        <button onclick="toggleAISummary()" class="btn-outline px-3 py-1 text-[10px] font-bold bg-yellow-50">✨ AI Summary</button>
                    </div>
                    <div id="ai-summary-box" class="hidden mb-6 p-4 bg-gray-50 border-2 border-black ai-glow text-sm italic"></div>
                    <div id="comment-list" class="space-y-4 mb-6"></div>
                    <div class="flex space-x-2">
                        <input type="text" id="comment-input" placeholder="Write a comment..." class="flex-grow border-2 border-black p-2 outline-none text-sm">
                        <button onclick="addComment()" class="btn-primary px-6 font-bold uppercase text-xs">Post</button>
                    </div>
                </div>
            </section>

            <!-- SECTION: Relationships & Chat -->
            <section id="page-relationships" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-3 border-2 border-black h-[70vh]">
                    <div class="border-r-2 border-black flex flex-col">
                        <div class="p-3 bg-black text-white text-xs font-bold uppercase flex justify-between">
                            <span>Conversations</span>
                            <button onclick="renderRelationships()" class="underline text-[10px]"></button>
                        </div>
                        <div id="conversation-list" class="overflow-y-auto flex-grow"></div>
                    </div>
                    <div class="md:col-span-2 flex flex-col bg-gray-50">
                        <div id="chat-header" class="p-4 border-b-2 border-black bg-white flex justify-between items-center">
                            <span id="chat-title" class="font-bold uppercase tracking-tight text-sm">Select a friend</span>
                            <div id="chat-actions" class="hidden flex space-x-2">
                                <button onclick="markAsRead()" class="text-[10px] underline text-gray-400 hover:text-black uppercase font-bold"></button>
                                <button onclick="deleteSession()" class="text-[10px] text-red-600 underline uppercase font-bold">Delete Thread</button>
                            </div>
                        </div>
                        <div id="chat-window" class="flex-grow p-4 overflow-y-auto space-y-4"></div>
                        <div class="p-4 bg-white border-t-2 border-black flex space-x-2">
                            <input type="text" placeholder="Type a message..." class="flex-grow border-2 border-black p-2 outline-none text-sm">
                            <button class="btn-primary px-4 font-bold uppercase text-xs">Send</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECTION: Profile -->
            <section id="page-profile" class="hidden max-w-2xl mx-auto">
                <div class="bento-card p-6 mb-8 flex items-center space-x-6">
                    <div class="w-20 h-20 border-2 border-black bg-gray-100 rounded-full flex items-center justify-center font-bold text-2xl">U</div>
                    <div class="flex-grow">
                        <h2 class="text-2xl font-bold uppercase tracking-tighter" id="profile-name-display">Alex Zhang</h2>
                        <p class="text-xs text-gray-500" id="profile-lang-display">Current Preferred Language: English</p>
                        <button onclick="openModal('modal-edit-profile')" class="mt-3 text-[10px] font-bold underline uppercase">Edit Profile Information</button>
                    </div>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-4 border-b-2 border-black pb-2 uppercase tracking-tight">My Community Activity</h3>
                    <div id="my-posts-list" class="space-y-4"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- MODALS -->
    <div id="modal-create-post" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
        <div class="bg-white border-4 border-black w-full max-w-xl p-6">
            <h2 class="font-bold text-xl mb-4 uppercase tracking-tighter">Create New Community Post</h2>
            <input type="text" placeholder="Post Title" class="w-full border-2 border-black p-2 mb-4 outline-none">
            <textarea class="w-full border-2 border-black p-2 h-32 mb-4 outline-none" placeholder="Write your post content here..."></textarea>
            <div class="flex space-x-4 mb-4 text-sm">
                <div class="border-2 border-dashed border-black h-20 flex-1 flex items-center justify-center text-[10px] uppercase font-bold text-gray-400 cursor-pointer">+ Add Images</div>
                <select class="border-2 border-black p-2 flex-1 outline-none text-xs">
                    <option>Select a Category Tag</option>
                    <option>Study</option><option>Housing</option><option>Travel</option><option>Part-time Job</option><option>Life Services</option>
                </select>
            </div>
            <div class="flex space-x-2">
                <button onclick="closeModal('modal-create-post')" class="flex-1 btn-outline py-2 font-bold uppercase text-xs">Cancel</button>
                <button onclick="submitPost()" class="flex-1 btn-primary py-2 font-bold uppercase text-xs">Publish Post</button>
            </div>
        </div>
    </div>

    <div id="modal-report" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
        <div class="bg-white border-4 border-black w-full max-w-sm p-6">
            <h2 class="font-bold text-lg mb-4 uppercase">Report Inappropriate Content</h2>
            <div class="space-y-2 mb-4">
                <label class="flex items-center text-sm"><input type="checkbox" class="mr-2"> Spam</label>
                <label class="flex items-center text-sm"><input type="checkbox" class="mr-2"> Fraud or Scam</label>
                <label class="flex items-center text-sm"><input type="checkbox" class="mr-2"> Abusive Language</label>
                <label class="flex items-center text-sm"><input type="checkbox" class="mr-2"> Other Reasons</label>
            </div>
            <textarea class="w-full border-2 border-black p-2 h-24 mb-4 outline-none text-sm resize-none" placeholder="Please provide more details about the issue..."></textarea>
            <button onclick="closeModal('modal-report')" class="w-full btn-primary py-2 font-bold uppercase text-xs">Submit Report</button>
        </div>
    </div>

    <div id="modal-edit-profile" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
        <div class="bg-white border-4 border-black w-full max-w-sm p-6">
            <h2 class="font-bold text-lg mb-4 uppercase">Update Profile</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase">Display Name</label>
                    <input type="text" id="edit-name" value="Alex Zhang" class="w-full border-2 border-black p-2 outline-none text-sm">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase">Interface Language</label>
                    <select id="edit-lang" class="w-full border-2 border-black p-2 outline-none text-sm">
                        <option value="English">English</option>
                        <option value="Chinese">Chinese (中文)</option>
                    </select>
                </div>
                <button onclick="saveProfile()" class="w-full btn-primary py-2 font-bold uppercase text-xs">Save Changes</button>
                <button onclick="closeModal('modal-edit-profile')" class="w-full btn-outline py-2 font-bold uppercase text-xs">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        // --- Mock Data ---
        const briefings = [
            { 
                id: 1, 
                source: "Bangkok Post", 
                title: "New Visa Rules for 2024", 
                summary: "The Thai government has introduced several new visa categories aimed at attracting digital nomads and retirees. These changes include a new 'Destination Thailand Visa' (DTV) which allows for a 5-year stay.", 
                time: "20-05-2024 09:15", 
                crawl: "20-05-2024 10:05", 
                url: "https://bangkokpost.com" 
            },
            { 
                id: 2, 
                source: "The Nation Thailand", 
                title: "Public Transport Expansion Plan", 
                summary: "City officials have unveiled a comprehensive 10-year plan to overhaul Bangkok's public transport system, including the expansion of the MRT and BTS lines.", 
                time: "19-05-2024 14:30", 
                crawl: "19-05-2024 16:02", 
                url: "https://nationthailand.com" 
            }
        ];

        let posts = [
            { 
                id: 101, author: "Liam Smith", title: "Study Spot in Library?", content: "The main library is super hot today. Any alternatives with good AC?", 
                likes: 5, comments: 2, tags: ["Study"], 
                comments_data: [
                    { id: 1, user: "Sarah", text: "Try the Art Building! It's usually empty and cool.", is_own: false, time: "1 hour ago" },
                    { id: 2, user: "Alex Zhang", text: "The basement of the student center is great.", is_own: true, time: "30 mins ago" }
                ],
                ai_sum: "Community suggests the Art Building or the student center basement as cooler study environments."
            },
            {
                id: 102, author: "Emily Watson", title: "Ayutthaya Day Trip This Sunday", content: "Hi everyone! Planning a day trip to Ayutthaya this Sunday. I found a van that fits 10 people. We currently have 4. Anyone want to join to split the cost? It's about 300 THB each for transport.",
                likes: 18, comments: 6, tags: ["Travel"],
                comments_data: [
                    { id: 3, user: "Kaito", text: "I'm in! Do we meet at the main gate?", is_own: false, time: "2 hours ago" },
                    { id: 4, user: "Mei Ling", text: "Is the entry fee for temples included?", is_own: false, time: "45 mins ago" }
                ],
                ai_sum: "Users are expressing interest in the group trip and clarifying meeting points and cost details."
            },
            {
                id: 103, author: "David Chen", title: "Best Bank for Student Account?", content: "Just arrived in Thailand. Which bank is the easiest for international students to open an account? SCB or Bangkok Bank? Need something with a good English app.",
                likes: 12, comments: 14, tags: ["Life Services"],
                comments_data: [
                    { id: 5, user: "Jessica", text: "Bangkok Bank near campus is very helpful with foreign docs.", is_own: false, time: "3 hours ago" },
                    { id: 6, user: "Alex Zhang", text: "SCB has a much better app interface in my opinion.", is_own: true, time: "10 mins ago" }
                ],
                ai_sum: "The community recommends Bangkok Bank for its documentation support and SCB for its superior mobile application."
            },
            {
                id: 104, author: "Sofia Rossi", title: "Summer Sublet - Studio near BTS", content: "Going home for the summer (June-August). Looking to sublet my studio near BTS On Nut. 12,000 THB/month. Fully furnished, pool, gym. PM if interested!",
                likes: 4, comments: 1, tags: ["Housing"],
                comments_data: [
                    { id: 7, user: "Omar", text: "Is the electricity bill included in the price?", is_own: false, time: "5 hours ago" }
                ],
                ai_sum: "Potential subletters are inquiring about utility costs for the temporary housing offer."
            },
            {
                id: 105, author: "Jason Park", title: "Part-time English Tutor Needed", content: "Looking for an English tutor for a high school student. 4 hours per week. 500 THB per hour. Prefer someone from a native English speaking country.",
                likes: 9, comments: 4, tags: ["Part-time Job"],
                comments_data: [
                    { id: 8, user: "Elena", text: "I'm a native speaker from the UK. Let's chat!", is_own: false, time: "1 hour ago" }
                ],
                ai_sum: "Qualified candidates, including a native speaker from the UK, are applying for the tutoring position."
            }
        ];

        let chats = [
            { id: 1, user: "Jessica Wong", lastMsg: "See you tomorrow!", unread: true },
            { id: 2, user: "Dr. Chen", lastMsg: "Project document is ready.", unread: false }
        ];

        let currentPostId = null;

        // --- Navigation ---
        function showPage(pageId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            const target = document.getElementById(`page-${pageId}`);
            if (target) target.classList.remove('hidden');
            
            const nav = document.getElementById('main-nav');
            if (pageId === 'auth') nav.classList.add('hidden');
            else nav.classList.remove('hidden');

            if (pageId === 'briefing') renderBriefings();
            if (pageId === 'community') renderFeed();
            if (pageId === 'relationships') renderRelationships();
            if (pageId === 'profile') renderProfile();
            window.scrollTo(0,0);
        }

        function toggleAuthMode(mode) {
            const btnLogin = document.getElementById('btn-login-mode');
            const btnReg = document.getElementById('btn-reg-mode');
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-register');
            if (mode === 'login') {
                btnLogin.classList.add('bg-black', 'text-white'); btnReg.classList.remove('bg-black', 'text-white');
                formLogin.classList.remove('hidden'); formReg.classList.add('hidden');
            } else {
                btnReg.classList.add('bg-black', 'text-white'); btnLogin.classList.remove('bg-black', 'text-white');
                formReg.classList.remove('hidden'); formLogin.classList.add('hidden');
            }
        }

        // --- Feature 1: Briefing Logic (Updated: Source Removed & Input Format) ---
        function renderBriefings() {
            const searchTerm = document.getElementById('briefing-search').value.toLowerCase();
            const startDateStr = document.getElementById('briefing-start-date').value;
            const endDateStr = document.getElementById('briefing-end-date').value;

            // Helper to parse DD-MM-YYYY string to Date
            const parseDateStr = (str) => {
                if(!str) return null;
                const p = str.split('-');
                if(p.length !== 3) return null;
                return new Date(p[2], parseInt(p[1])-1, p[0]);
            };

            const fStart = parseDateStr(startDateStr);
            const fEnd = parseDateStr(endDateStr);

            const filtered = briefings.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(searchTerm) || b.summary.toLowerCase().includes(searchTerm);
                
                // Parse mock data date (DD-MM-YYYY)
                const parts = b.time.split(' ')[0].split('-'); 
                const bDate = new Date(parts[2], parseInt(parts[1]) - 1, parts[0]);

                let matchesStart = true;
                if (fStart) matchesStart = bDate >= fStart;

                let matchesEnd = true;
                if (fEnd) matchesEnd = bDate <= fEnd;

                return matchesSearch && matchesStart && matchesEnd;
            });

            const container = document.getElementById('briefing-container');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-12 text-center border-2 border-black border-dashed text-gray-400 font-bold uppercase tracking-widest">No results matching your filters</div>`;
                return;
            }

            container.innerHTML = filtered.map(b => `
                <div class="bento-card p-4">
                    <div class="flex justify-between items-start mb-2">
                        <span class="status-badge text-[9px]">${b.source}</span>
                        <span class="text-[9px] text-gray-400 font-bold uppercase">${b.time}</span>
                    </div>
                    <h3 class="font-bold text-lg mb-1 uppercase tracking-tight">${b.title}</h3>
                    <p class="text-sm text-gray-600 mb-4 line-clamp-2">${b.summary}</p>
                    <div class="flex justify-end space-x-2">
                        <button onclick="openBriefingDetail(${b.id})" class="text-xs font-bold underline uppercase">View Detail</button>
                        <a href="${b.url}" target="_blank" class="text-xs font-bold border-2 border-black px-2 uppercase hover:bg-black hover:text-white">Original Link</a>
                    </div>
                </div>
            `).join('');
        }

        function openBriefingDetail(id) {
            const b = briefings.find(item => item.id === id);
            showPage('briefing-detail');
            document.getElementById('briefing-detail-content').innerHTML = `
                <div class="bento-card p-8">
                    <div class="mb-6">
                        <span class="text-xs font-bold text-gray-400 uppercase">Published: ${b.time}</span>
                    </div>
                    <h1 class="text-3xl font-bold mb-6 uppercase tracking-tighter leading-none border-b-2 border-black pb-4">${b.title}</h1>
                    <div class="prose max-w-none">
                        <div class="flex items-center space-x-2 mb-4"><span class="text-[9px] font-bold uppercase tracking-widest bg-yellow-100 px-1">Qwen AI Summary</span></div>
                        <p class="text-lg leading-relaxed text-gray-800">${b.summary}</p>
                    </div>
                </div>
            `;
        }

        // --- Feature 2: Community (Updated Tag Filter Logic) ---
        
        function handleTagFilter(checkbox) {
            if (checkbox.value === 'All') {
                if (checkbox.checked) {
                    // Uncheck all other checkboxes if "All" is selected
                    document.querySelectorAll('#tag-filters input').forEach(i => {
                        if (i.value !== 'All') i.checked = false;
                    });
                } else {
                    // Prevent unchecking "All" if it leaves nothing selected (optional UX choice, here we let it handle in renderFeed)
                }
            } else {
                if (checkbox.checked) {
                    // Uncheck "All" if a specific tag is selected
                    const allBox = document.querySelector('#tag-filters input[value="All"]');
                    if (allBox) allBox.checked = false;
                }
            }
            renderFeed();
        }

        function renderFeed() {
            const searchTerm = document.getElementById('community-search') ? document.getElementById('community-search').value.toLowerCase() : '';
            
            // Get selected tags
            const checkedBoxes = Array.from(document.querySelectorAll('#tag-filters input:checked'));
            const selectedTags = checkedBoxes.map(cb => cb.value);
            const isAllSelected = selectedTags.includes('All') || selectedTags.length === 0; // Default to All if nothing checked

            const container = document.getElementById('community-feed-list');
            
            const filteredPosts = posts.filter(p => {
                // 1. Search Filter
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || p.content.toLowerCase().includes(searchTerm);
                
                // 2. Tag Filter
                let matchesTag = false;
                if (isAllSelected) {
                    matchesTag = true;
                } else {
                    // Check if post has at least one of the selected tags
                    matchesTag = p.tags.some(tag => selectedTags.includes(tag));
                }

                return matchesSearch && matchesTag;
            });

            if (filteredPosts.length === 0) {
                container.innerHTML = `<div class="p-12 text-center border-2 border-black border-dashed text-gray-400 font-bold uppercase tracking-widest">No matching posts found</div>`;
                return;
            }

            container.innerHTML = filteredPosts.map(p => `
                <div class="bento-card p-6 cursor-pointer" onclick="openPostDetail(${p.id})">
                    <div class="flex justify-between mb-4">
                        <div class="flex items-center space-x-2"><div class="w-8 h-8 border-2 border-black bg-gray-100 rounded-full flex items-center justify-center font-bold text-[10px]">${p.author[0]}</div><span class="text-sm font-bold uppercase">${p.author}</span></div>
                        <div class="flex space-x-1">${p.tags.map(t => `<span class="status-badge text-[9px]">${t}</span>`).join('')}</div>
                    </div>
                    <h4 class="font-bold text-xl mb-2 uppercase tracking-tight">${p.title}</h4>
                    <p class="text-gray-700 text-sm mb-4 line-clamp-2">${p.content}</p>
                    <div class="flex justify-between items-center text-xs font-bold pt-4 border-t uppercase opacity-50">
                        <div class="flex space-x-4"><span>Likes (${p.likes})</span><span>Comments (${p.comments})</span></div>
                        <span class="underline">Read More</span>
                    </div>
                </div>
            `).join('');
        }

        function openPostDetail(id) {
            const p = posts.find(item => item.id === id);
            currentPostId = id;
            showPage('post-detail');
            document.getElementById('post-detail-content').innerHTML = `
                <div class="bento-card p-8">
                    <div class="flex justify-between mb-6">
                        <div class="flex items-center space-x-3"><div class="w-12 h-12 border-2 border-black bg-gray-100 rounded-full flex items-center justify-center font-bold">${p.author[0]}</div><div class="font-bold uppercase">${p.author}</div></div>
                        <button onclick="openModal('modal-report')" class="text-xs text-red-500 font-bold underline uppercase">Report</button>
                    </div>
                    <h1 class="text-4xl font-bold mb-4 tracking-tighter uppercase leading-none">${p.title}</h1>
                    <p class="text-xl leading-relaxed mb-8 text-gray-800">${p.content}</p>
                    <div class="flex space-x-2">
                        <button class="btn-primary px-6 py-2 font-bold uppercase text-xs" onclick="this.innerText='LIKED'">Like</button>
                        <button onclick="showPage('relationships'); selectChat('${p.author}')" class="btn-outline px-6 py-2 font-bold uppercase text-xs">Direct Message</button>
                    </div>
                </div>
            `;
            renderComments(p.comments_data);
            document.getElementById('ai-summary-box').innerText = p.ai_sum;
            document.getElementById('ai-summary-box').classList.add('hidden');
        }

        function renderComments(comments) {
            const container = document.getElementById('comment-list');
            container.innerHTML = comments.map(c => `
                <div class="flex space-x-3">
                    <div class="w-8 h-8 border-2 border-black rounded-full flex items-center justify-center text-xs font-bold">${c.user[0]}</div>
                    <div class="flex-grow border-b border-gray-100 pb-4">
                        <div class="flex justify-between mb-1"><span class="text-xs font-bold uppercase">${c.user}</span><span class="text-[8px] text-gray-400 uppercase">${c.time}</span></div>
                        <p class="text-sm text-gray-600">${c.text}</p>
                        ${c.is_own ? `<button onclick="deleteCommentLocal(${c.id})" class="text-[8px] text-red-500 font-bold underline uppercase mt-2">Delete</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function addComment() {
            const val = document.getElementById('comment-input').value; if(!val) return;
            const p = posts.find(item => item.id === currentPostId);
            p.comments_data.push({ id: Date.now(), user: "Alex Zhang", text: val, is_own: true, time: "Just now" });
            p.comments++; renderComments(p.comments_data); document.getElementById('comment-input').value = '';
        }

        function deleteCommentLocal(id) {
            if(!confirm("Delete this comment?")) return;
            const p = posts.find(item => item.id === currentPostId);
            p.comments_data = p.comments_data.filter(c => c.id !== id); p.comments--; renderComments(p.comments_data);
        }

        function renderRelationships() {
            const container = document.getElementById('conversation-list');
            container.innerHTML = chats.map(c => `
                <div onclick="selectChat('${c.user}')" class="p-4 border-b border-black cursor-pointer hover:bg-white group ${c.unread ? 'bg-yellow-50' : ''}">
                    <div class="flex justify-between items-center mb-1"><span class="font-bold text-sm uppercase">${c.user}</span>${c.unread ? '<span class="w-2 h-2 bg-black rounded-full"></span>' : ''}</div>
                    <p class="text-[9px] text-gray-500 truncate uppercase opacity-50 font-bold">${c.lastMsg}</p>
                </div>
            `).join('');
        }

        function selectChat(user) {
            document.getElementById('chat-title').innerText = user; document.getElementById('chat-actions').classList.remove('hidden');
            document.getElementById('chat-window').innerHTML = `
                <div class="flex justify-start"><div class="p-2 border-2 border-black bg-white text-xs max-w-[80%] uppercase">Hello! I saw your post. Is it still available?</div></div>
                <div class="flex justify-end"><div class="p-2 bg-black text-white text-xs max-w-[80%] uppercase">Yes, absolutely! Would you like to know more?</div></div>
            `;
        }

        function markAsRead() { alert("Session marked as read."); }
        function deleteSession() { if(confirm("Delete this thread?")) { alert("Thread deleted."); showPage('relationships'); } }

        function renderProfile() {
            const list = document.getElementById('my-posts-list');
            list.innerHTML = `
                <div class="bento-card p-4 flex justify-between items-center"><div><h4 class="font-bold text-xs uppercase tracking-tight">Visa Extension Guide</h4><span class="text-[8px] font-bold text-gray-400 uppercase">18-05-2024</span></div><span class="status-badge bg-black text-white">Published</span></div>
                <div class="bento-card p-4 flex justify-between items-center opacity-60"><div><h4 class="font-bold text-xs uppercase tracking-tight">Late night study cafes</h4><span class="text-[8px] font-bold text-gray-400 uppercase">21-05-2024</span></div><span class="status-badge">Reviewing</span></div>
            `;
        }

        function saveProfile() {
            const name = document.getElementById('edit-name').value;
            const lang = document.getElementById('edit-lang').value;
            document.getElementById('profile-name-display').innerText = name;
            document.getElementById('profile-lang-display').innerText = `Current Preferred Language: ${lang}`;
            closeModal('modal-edit-profile');
        }

        // --- Helpers ---
        function handleLogin(e) { e.preventDefault(); showPage('briefing'); }
        function handleRegister(e) { e.preventDefault(); alert("Verification code sent."); toggleAuthMode('login'); }
        function handleLogout() { if(confirm("Logout?")) showPage('auth'); }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function submitPost() { alert("Qwen AI is processing your post. Redirecting..."); closeModal('modal-create-post'); }
        function toggleAISummary() { document.getElementById('ai-summary-box').classList.toggle('hidden'); }
        function toggleLanguage(v) { alert(`Language switched to: ${v}`); }
        function setRegType(t) {
            const btnE = document.getElementById('reg-type-email'); const btnP = document.getElementById('reg-type-phone');
            const input = document.getElementById('reg-input-main');
            if(t === 'email') { btnE.classList.add('bg-black', 'text-white'); btnP.classList.remove('bg-black', 'text-white'); input.placeholder = "University Email"; }
            else { btnP.classList.add('bg-black', 'text-white'); btnE.classList.remove('bg-black', 'text-white'); input.placeholder = "Mobile Number"; }
        }

        window.onload = () => showPage('auth');
    </script>
</body>
</html>
